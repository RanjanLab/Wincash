// GAS API Wrapper
async function api(action, data={}, method='POST'){
 if(!GAS_URL) { if(USE_MOCK_IF_NO_GAS) return {mock:true}; throw 'GAS_URL not set'; }
 try{
  if(method==='GET'){
    const url = GAS_URL + '?action='+action+'&'+new URLSearchParams(data).toString();
    const res = await fetch(url); return await res.json();
  } else {
    const res = await fetch(GAS_URL, {method:'POST', body: JSON.stringify({action, ...data})});
    return await res.json();
  }
 } catch(e){ console.error(e); return {success:false, error:e}; }
}

}

function navigate(p){

 currentPage=p; render();

}

// Pages
function render(){

let authMode='login';
function setAuth(m){ authMode=m; document.getElementById('tab-login').className = m==='login'?'flex-1 py-2 rounded-full bg-white text-black font-bold text-sm':'flex-1 py-2 rounded-full text-white/60 font-bold text-sm'; document.getElementById('tab-reg').className = m==='register'?'flex-1 py-2 rounded-full bg-white text-black font-bold text-sm':'flex-1 py-2 rounded-full text-white/60 font-bold text-sm'; renderAuth(); }
function renderAuth(){
 const box=document.getElementById('authBox');
 if(!box) return;
 if(authMode==='login'){
  box.innerHTML = `<div class="space-y-3"><input id="l_mobile" placeholder="Mobile Number" class="w-full bg-black/30 border border-white/10 rounded-full px-5 py-3 text-sm outline-none"><div class="relative"><input id="l_pass" type="password" placeholder="Password" class="w-full bg-black/30 border border-white/10 rounded-full px-5 py-3 text-sm outline-none"><button onclick="togglePass('l_pass')" class="absolute right-4 top-3 text-white/40"><i class="fa-solid fa-eye"></i></button></div><button onclick="doLogin()" id="btnLogin" class="w-full py-3 rounded-full bg-gradient-to-r from-violet-600 to-orange-500 font-bold">Login</button><button onclick="setAuth('forgot')" class="w-full text-xs text-white/60">Forget Password?</button></div>`;

 }
}

async function doLogin(){
 const m=document.getElementById('l_mobile').value, p=document.getElementById('l_pass').value;
 if(!m||!p) return showToast('Mobile password bharo');
 showLoader(true);
 if(GAS_URL){
  const res=await api('login',{mobile:m,password:p});
  showLoader(false);
  if(!res.success) return showToast(res.message||'Login failed');
  // sync to local for UI
  let u=users.find(x=>x.mobile===m);
  if(!u){ users.push({id:res.user.userId||res.user.id,name:res.user.name,mobile:m,email:res.user.email,wallet:Number(res.user.wallet||0),spinChances:Number(res.user.spinChances||0),referralCode:res.user.referralCode||res.user.userId,isAdmin:res.user.isAdmin==='TRUE'||res.user.isAdmin===true,transactions:[],joined:[],bank:null,createdAt:res.user.createdAt}); u=users[users.length-1]; }
  currentUserId=u.id; save(); render();
 } else {
  showLoader(false);
  const u=users.find(x=>x.mobile===m && x.password===p);
  if(!u) return showToast('Invalid mobile or password');
  currentUserId=u.id; save(); render(); showToast('Login success');
 }
}
async function doRegister(){
 const name=document.getElementById('r_name').value, mobile=document.getElementById('r_mobile').value, email=document.getElementById('r_email').value, pass=document.getElementById('r_pass').value, ref=document.getElementById('r_ref').value;
 if(!name||!mobile||!email||!pass) return showToast('All fields required');
 if(users.find(u=>u.mobile===mobile)) return showToast('Mobile already registered');
 showLoader(true);
 if(GAS_URL){
  const res=await api('register',{name,mobile,email,password:pass,referralCode:ref});
  showLoader(false);
  if(!res.success) return showToast(res.message);
  showToast('Registration success! Login karo');
  setAuth('login');
 } else {
  const id='WC'+Math.floor(100000+Math.random()*900000);
  const newUser={id,name,mobile,email,password:pass,wallet:0,spinChances:1,referralCode:id,isAdmin:false,transactions:[],joined:[],bank:null,createdAt:new Date().toISOString(),referredBy:ref||''};
  users.push(newUser);
  if(ref){ const refUser=users.find(u=>u.referralCode===ref||u.id===ref); if(refUser){ refUser.spinChances+=1; referrals.push({referrerId:refUser.id,referredId:id,referredName:name,referredMobile:mobile,date:new Date().toISOString()}); } }
  showLoader(false); save(); showToast('Registered! 1 Free Spin mila'); setAuth('login');
 }
}
async function doForgot(){
 const m=document.getElementById('f_mobile').value;
 if(GAS_URL){ showLoader(true); const res=await api('forgotpassword',{mobile:m}); showLoader(false); showToast(res.message||'Password sent to email'); }
 else { const u=users.find(x=>x.mobile===m); if(!u) return showToast('Mobile not found'); showToast('Password: '+u.password+' (Mock - Email: '+u.email+')'); }
}

let wheelRotation=0;
function drawWheel(){
 const canvas=document.getElementById('wheelCanvas'); if(!canvas) return;
 const ctx=canvas.getContext('2d'); const slices=settings.slices; const cx=150,cy=150,r=140;
 ctx.clearRect(0,0,300,300);
 slices.forEach((s,i)=>{
  const start = (wheelRotation + i* (360/slices.length)) * Math.PI/180;
  const end = (wheelRotation + (i+1)* (360/slices.length)) * Math.PI/180;
  ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,start,end); ctx.closePath(); ctx.fillStyle=s.color; ctx.fill(); ctx.strokeStyle='rgba(255,255,255,.05)'; ctx.stroke();
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(start + (Math.PI / slices.length)); ctx.textAlign='right'; ctx.fillStyle='#fff'; ctx.font='bold 14px Outfit'; ctx.fillText(s.label, r-15, 5); ctx.restore();
 });
}
async function doSpin(){
 const cu=getCurrent(); if(!cu) return;
 if(isSpinning) return;
 if(cu.spinChances<=0){ document.getElementById('noChanceModal').style.display='flex'; return; }
 isSpinning=true; const btn=document.getElementById('spinBtn'); btn.innerHTML='<div class="spin-loader mx-auto"></div>'; btn.disabled=true;
 let result;
 if(GAS_URL){
  const res=await api('spin',{userId:cu.id});
  if(res.noChance){ isSpinning=false; btn.innerHTML='SPIN NOW'; btn.disabled=false; document.getElementById('noChanceModal').style.display='flex'; return; }
  result=res.result || settings.slices[Math.floor(Math.random()*6)];
  // update local wallet mock
  cu.spinChances-=1;
  if(result.type==='amount' || result.amount>0){ const amt = result.amount || result.value || 0; cu.wallet+=Number(amt); }
 } else {
  // mock spin
  cu.spinChances-=1;
  const idx=Math.floor(Math.random()*settings.slices.length); result=settings.slices[idx];
  if(result.type==='amount' && result.value>0){ cu.wallet+=result.value; cu.transactions.push({id:'TXN'+Date.now(),date:new Date().toISOString(),type:'Spin Win',amount:result.value,status:'Success'}); flyingCoin(result.value); }
 }
 save(); renderMenu();
 const sliceIndex=settings.slices.findIndex(s=>s.label===result.label);
 const targetAngle = 360 - (sliceIndex * (360/settings.slices.length)) - 90; // pointer top
 const extra = 360*5 + Math.random()*30;
 wheelRotation+=extra+targetAngle;
 let start=null; const duration=3000;
 function anim(t){ if(!start) start=t; const prog=Math.min((t-start)/duration,1); const ease=1-Math.pow(1-prog,3); const curRot = wheelRotation*ease; const c=document.getElementById('wheelCanvas'); if(c){ const ctx=c.getContext('2d'); const cx=150,cy=150,r=140; ctx.clearRect(0,0,300,300); settings.slices.forEach((s,i)=>{ const st=(curRot + i*60)*Math.PI/180; const en=(curRot + (i+1)*60)*Math.PI/180; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,st,en); ctx.closePath(); ctx.fillStyle=s.color; ctx.fill(); ctx.save(); ctx.translate(cx,cy); ctx.rotate(st+ (30*Math.PI/180)); ctx.textAlign='right'; ctx.fillStyle='#fff'; ctx.font='bold 14px Outfit'; ctx.fillText(s.label,r-15,5); ctx.restore(); }); } if(prog<1) requestAnimationFrame(anim); else { isSpinning=false; btn.innerHTML='SPIN NOW'; btn.disabled=false; wheelRotation=curRot%360; showResult(result); bumpWallet(); render(); } }
 requestAnimationFrame(anim);
}

 for(let i=0;i<3;i++){ const el=document.createElement('div'); el.className='fixed z-[200] w-8 h-8 rounded-full bg-gradient-to-br from-yellow-400 to-orange-500 flex items-center justify-center font-black text-[10px] text-black'; el.textContent='₹'+amount; el.style.left=(window.innerWidth/2+ (Math.random()*60-30))+'px'; el.style.top=(window.innerHeight/2)+'px'; el.style.setProperty('--tx', (rect.left - window.innerWidth/2)+'px'); el.style.setProperty('--ty', (rect.top - window.innerHeight/2)+'px'); el.style.animation='floatUp .9s forwards'; document.body.appendChild(el); setTimeout(()=>el.remove(),900); }

  box.innerHTML = `<div class="space-y-4"><h4 class="font-bold text-sm">Deposits Pending (${deposits.filter(d=>d.status==='pending').length})</h4>${deposits.filter(d=>d.status==='pending').map(d=> `<div class="bg-[#1a1140] rounded-xl p-3 flex justify-between items-center border border-white/5 text-xs"><span>${d.userId} • ₹${d.amount} • UTR:${d.utr}</span><button onclick="approveDeposit('${d.id}')" class="px-3 py-1 rounded-full bg-emerald-500 font-bold">Approve</button></div>`).join('')||'<div class="text-white/30 text-xs">No pending deposits</div>'}<h4 class="font-bold text-sm mt-4">Withdraw Pending (${withdrawals.filter(w=>w.status==='pending').length})</h4>${withdrawals.filter(w=>w.status==='pending').map(w=> { const u=users.find(x=>x.id===w.userId); const bank=u?.bank; return `<div class="bg-[#1a1140] rounded-xl p-3 border border-white/5 text-xs"><div class="flex justify-between"><span>${w.userId} • ₹${w.amount}</span><button onclick="approveWithdraw('${w.id}')" class="px-3 py-1 rounded-full bg-emerald-500 font-bold">Approve</button></div>${bank?`<div class="mt-2 text-[11px] text-white/60">Bank: ${bank.bankName} • ${bank.account} • IFSC:${bank.ifsc} ${bank.upi?`• UPI:${bank.upi} <a href="upi://pay?pa=${bank.upi}&am=${w.amount}&pn=${u.name}" class="ml-2 px-2 py-1 bg-violet-600 rounded-full">Pay Now</a>`:''}</div>`:''}</div>`}).join('')||'<div class="text-white/30 text-xs">No pending withdraw</div>'}</div>`;
 } else if(t==='lottery'){
  box.innerHTML = `<div class="space-y-4">${lotteries.map(l=> `<div class="bg-[#1a1140] rounded-xl p-4 border border-white/5"><div class="flex justify-between"><b class="text-sm">${l.name} • Entry ₹${l.entryFee} • Pool ₹${l.prizePool}</b><span class="text-xs">${l.participants.length} joined</span></div><div class="mt-3 space-y-1 max-h-[150px] overflow-auto">${l.participants.map(pid=>{ const pu=users.find(u=>u.id===pid); return `<div class="flex justify-between bg-black/30 rounded-full px-3 py-2 text-[11px]"><span>${pu?.name} • ${pid}</span><button onclick="winSelect('${l.id}','${pid}')" class="px-3 py-1 rounded-full bg-white/10">Win Select</button></div>`}).join('')||'<div class="text-white/30 text-xs">No participants</div>'}</div><button onclick="finalizeWinners('${l.id}')" class="mt-3 w-full py-2 rounded-full bg-gradient-to-r from-violet-600 to-orange-500 text-xs font-bold">Final Win - Divide Pool</button></div>`).join('')}<div class="mt-6 p-4 bg-white/5 rounded-xl"><h4 class="font-bold text-sm">Add Lottery</h4><input id="lotName" placeholder="Lottery Name" class="w-full mt-2 bg-black/30 border border-white/10 rounded-full px-4 py-2 text-xs"><div class="grid grid-cols-2 gap-2 mt-2"><input id="lotFee" type="number" placeholder="Entry Fee" class="bg-black/30 border border-white/10 rounded-full px-4 py-2 text-xs"><input id="lotPool" type="number" placeholder="Prize Pool" class="bg-black/30 border border-white/10 rounded-full px-4 py-2 text-xs"></div><button onclick="addLottery()" class="w-full mt-3 py-2 rounded-full bg-white text-black font-bold text-xs">Add Lottery</button></div></div>`;
 } else if(t==='settings'){
  box.innerHTML = `<div class="bg-[#1a1140] rounded-xl p-4 border border-white/5 space-y-3"><h4 class="font-bold text-sm">Settings (Sheet se fetch hoga)</h4><input id="set_upi" value="${settings.upiId}" placeholder="UPI ID" class="w-full bg-black/30 border border-white/10 rounded-full px-4 py-2 text-xs"><input id="set_wa" value="${settings.supportWhatsapp}" placeholder="Support WhatsApp" class="w-full bg-black/30 border border-white/10 rounded-full px-4 py-2 text-xs"><div class="grid grid-cols-2 gap-2"><input id="set_minW" value="${settings.minWithdraw}" placeholder="Min Withdraw" class="bg-black/30 border border-white/10 rounded-full px-4 py-2 text-xs"><input id="set_minD" value="${settings.minDeposit}" placeholder="Min Deposit" class="bg-black/30 border border-white/10 rounded-full px-4 py-2 text-xs"></div><button onclick="saveSettings()" class="w-full py-2 rounded-full bg-emerald-500 font-bold text-xs">Save Settings to Sheet</button><div class="text-[10px] text-white/40 mt-2">GitHub pe ye local save hoga, GAS_URL hone par sheet me save hoga</div></div>`;
 }
}
let winSelections={};
function winSelect(lotId,userId){ winSelections[lotId]=winSelections[lotId]||[]; if(winSelections[lotId].includes(userId)) winSelections[lotId]=winSelections[lotId].filter(x=>x!==userId); else winSelections[lotId].push(userId); showToast((winSelections[lotId].length)+' selected'); }
async function finalizeWinners(lotId){
 const lot=lotteries.find(l=>l.id===lotId); const selected=winSelections[lotId]||[]; if(selected.length===0) return showToast('Koi winner select nahi kiya');
 const per = Math.floor(lot.prizePool/selected.length);
 if(GAS_URL){ showLoader(true); const res=await api('admin_declarewinners',{entryFee:lot.entryFee,winnerUserIds:selected,lotteryId:lotId}); showLoader(false); showToast(res.message||'Winners declared'); return; }
 selected.forEach(uid=>{ const u=users.find(x=>x.id===uid); u.wallet+=per; u.transactions.push({id:'TXN'+Date.now(),date:new Date().toISOString(),type:'Lottery Win '+lot.name,amount:per,status:'Success'}); winners.push({id:'WIN'+Date.now()+uid,date:new Date().toISOString(),userId:uid,drawName:lot.name,prize:per}); });
 save(); showToast(selected.length+' winners ko ₹'+per+' mila'); render();
}
function approveDeposit(id){ const d=deposits.find(x=>x.id===id); const u=users.find(x=>x.id===d.userId); u.wallet+=d.amount; d.status='approved'; u.transactions.push({id:'TXN'+Date.now(),date:new Date().toISOString(),type:'Deposit Success',amount:d.amount,status:'Success'}); save(); showToast('Deposit approved'); setAdminTab('req'); }
function approveWithdraw(id){ const w=withdrawals.find(x=>x.id===id); w.status='approved'; const u=users.find(x=>x.id===w.userId); u.transactions.push({id:'TXN'+Date.now(),date:new Date().toISOString(),type:'Withdrawal Success',amount:-w.amount,status:'Success'}); save(); showToast('Withdraw approved'); setAdminTab('req'); }
function addLottery(){ const name=document.getElementById('lotName').value, fee=Number(document.getElementById('lotFee').value), pool=Number(document.getElementById('lotPool').value); if(!name||!fee||!pool) return showToast('All fields'); lotteries.push({id:'L'+Date.now(),name,entryFee:fee,prizePool:pool,participants:[],status:'active',date:new Date().toISOString()}); save(); showToast('Lottery added'); setAdminTab('lottery'); }
function saveSettings(){ settings.upiId=document.getElementById('set_upi').value; settings.supportWhatsapp=document.getElementById('set_wa').value; settings.minWithdraw=Number(document.getElementById('set_minW').value); settings.minDeposit=Number(document.getElementById('set_minD').value); if(GAS_URL){ api('admin_updatesettings',{settings}); } showToast('Settings saved'); }

// Init
render(); renderMenu();
if(GAS_URL){ api('getsettings',{},'GET').then(r=>{ if(r.settings){ settings.upiId=r.settings.upiId||settings.upiId; settings.supportWhatsapp=r.settings.supportWhatsapp||settings.supportWhatsapp; settings.minWithdraw=Number(r.settings.minWithdraw||settings.minWithdraw); settings.minDeposit=Number(r.settings.minDeposit||settings.minDeposit); render(); } }); }
</script>

tps:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocu
